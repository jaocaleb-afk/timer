<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOOLS Timer Studio</title>
<style>
:root{--b:#2f6bff;--bd:#1f4fd1;--bg:#f2f5fb;--p:#fff;--t:#14213d;--m:#5b6885;--l:#dbe3f0;--g:#12a150;--r:#d8334a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t);background:var(--bg);display:grid;grid-template-rows:50px 1fr 232px;grid-template-columns:330px 1fr;grid-template-areas:"top top" "ins mid" "tl tl";overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--l);background:var(--p);border-radius:7px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--b)}button.pri{background:var(--b);border-color:var(--b);color:#fff;font-weight:600}button.pri:hover{background:var(--bd)}button.dng{color:var(--r)}
:focus-visible{outline:2px solid var(--b);outline-offset:1px}
#top{grid-area:top;background:var(--p);border-bottom:1px solid var(--l);display:flex;align-items:center;gap:8px;padding:0 12px}
.logo{font-weight:800;color:var(--b);letter-spacing:.5px}.sub{color:var(--m);font-weight:600}
#pname{border:1px solid transparent;border-radius:6px;padding:4px 8px;width:200px;background:transparent;font-weight:600}#pname:hover,#pname:focus{border-color:var(--l);background:#fff}
#status{color:var(--m);font-size:12px;margin-left:4px}.sp{flex:1}
#ins{grid-area:ins;background:var(--p);border-right:1px solid var(--l);overflow:auto;display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--l);position:sticky;top:0;background:var(--p);z-index:2}
.tabs button{flex:1;border:0;border-radius:0;border-bottom:2px solid transparent;padding:10px 2px}.tabs button.on{border-color:var(--b);color:var(--b);font-weight:700}
.pn{padding:12px;display:flex;flex-direction:column;gap:8px}
.f{display:grid;grid-template-columns:105px 1fr;gap:6px;align-items:center}.f span{color:var(--m);font-size:12.5px}
.f input[type=text],.f input[type=number],.f select,.f textarea{width:100%;border:1px solid var(--l);border-radius:6px;padding:5px 7px;background:#fff}
.f input[type=color]{width:44px;height:28px;padding:0;border:1px solid var(--l);border-radius:6px}.f input[type=range]{width:100%}
h4{margin:8px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--m)}
.row{display:flex;gap:6px;flex-wrap:wrap}.hint{font-size:12px;color:var(--m)}
.li{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--l);border-radius:7px;cursor:pointer}.li.on{border-color:var(--b);background:#eef3ff}.li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mid{grid-area:mid;display:flex;flex-direction:column;min-width:0;min-height:0}
#stage{flex:1;background:#0b1220;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;overflow:hidden}
#cw{position:relative}#cv{display:block;background:#000;cursor:move}#cv:fullscreen{width:100%!important;height:100%!important;object-fit:contain;cursor:none}
#wh{position:absolute;display:none;pointer-events:none;border:1px dashed var(--b)}#wh b{position:absolute;top:50%;width:12px;height:30px;margin-top:-15px;background:var(--b);border-radius:4px;pointer-events:auto;cursor:ew-resize}#wh b.l{left:-6px}#wh b.r{right:-6px}
#safe{position:absolute;inset:0;pointer-events:none;display:none}#safe i{position:absolute;border:1px dashed rgba(255,255,255,.55)}
#tb{background:var(--p);border-top:1px solid var(--l);display:flex;align-items:center;gap:6px;padding:6px 10px}
#scrub{flex:1}#tt{font-variant-numeric:tabular-nums;min-width:120px;text-align:right;color:var(--m)}#tj{width:70px;border:1px solid var(--l);border-radius:6px;padding:4px 6px}
#tl{grid-area:tl;background:var(--p);border-top:1px solid var(--l);display:flex;flex-direction:column;min-height:0}
#tlh{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--l)}
#tls{flex:1;overflow:auto;position:relative}#tlin{position:relative;min-height:100%}
#ruler{height:24px;border-bottom:1px solid var(--l);position:sticky;top:0;background:#fafcff;z-index:3;cursor:col-resize}
.tk{position:absolute;top:0;height:24px;border-left:1px solid #b9c5dc;font-size:11px;color:var(--m);padding-left:3px;pointer-events:none}
.rw{position:relative;height:30px;border-bottom:1px solid #eef1f7}
.bk{position:absolute;top:3px;height:24px;border-radius:6px;background:#9db9ff;border:1px solid var(--b);overflow:hidden;white-space:nowrap;font-size:12px;padding:3px 10px;cursor:grab;user-select:none}
.bk.tm{background:#b8e7cc;border-color:var(--g)}.bk.sel{box-shadow:0 0 0 2px var(--b);background:#7ea3ff}.bk.off{opacity:.45}
.bk b{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}.bk b.l{left:0}.bk b.r{right:0}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--r);z-index:4;pointer-events:none}
#ov{position:fixed;inset:0;background:rgba(10,20,40,.6);display:none;align-items:center;justify-content:center;z-index:50}
#ov>div{background:#fff;border-radius:12px;padding:22px;width:min(460px,92vw);display:flex;flex-direction:column;gap:12px}
progress{width:100%;height:14px}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:60;max-width:80vw}
@media(max-width:900px){body{grid-template-columns:260px 1fr}#pname{width:110px}}
</style></head><body>
<header id="top"><span class="logo">PROTOOLS</span><span class="sub">Timer Studio</span>
<input id="pname" aria-label="Project name"><span id="status"></span><span class="sp"></span>
<button id="bNew" title="New project">New</button><button id="bOpen" title="Open project file">Open…</button><button id="bSave" title="Save portable project file (includes media)">Save file</button>
<button id="bUndo" title="Undo (Ctrl+Z)">↶</button><button id="bRedo" title="Redo (Ctrl+Shift+Z)">↷</button>
<button id="bExp" class="pri">Export MP4</button><input type="file" id="fOpen" accept=".json" hidden></header>
<aside id="ins"><div class="tabs" id="tabs"></div><div class="pn" id="pn"></div></aside>
<main id="mid"><div id="stage"><div id="cw"><canvas id="cv" aria-label="Composition preview"></canvas><div id="wh" title="Drag a handle to change the wrap width"><b class="l"></b><b class="r"></b></div><div id="safe"><i style="inset:5%"></i><i style="inset:3.5%"></i></div></div></div>
<div id="tb"><button id="bPlay" title="Play/Pause (Space)">▶</button><button id="bStop" title="Stop">■</button><button id="bRest" title="Restart (Home)">⏮</button>
<button id="bSeg" title="Preview 5 seconds around the playhead">Segment</button><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Scrubber"><span id="tt"></span>
<input id="tj" placeholder="m:ss" title="Jump to time, then press Enter" aria-label="Jump to time"><button id="bFull" title="Full-screen audience preview">⛶</button></div></main>
<section id="tl"><div id="tlh"><b>Timeline</b><button id="zO">−</button><button id="zI">+</button><button id="zF">Fit</button><span class="hint">Drag blocks to move, drag edges to resize, click ruler to seek.</span></div>
<div id="tls"><div id="tlin"><div id="ruler"></div><div id="rows"></div><div id="ph"></div></div></div></section>
<div id="ov"><div id="ovb"></div></div><div id="toast" role="status"></div>
<script>
'use strict';
/* ===== utils ===== */
const $=s=>document.querySelector(s),cl=(v,a,b)=>Math.min(b,Math.max(a,v)),uid=()=>Math.random().toString(36).slice(2,10);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else if(['value','checked','textContent','disabled'].includes(x))e[x]=v;else e.setAttribute(x,v)}k.flat().forEach(c=>e.append(c));return e};
let tt;const toast=(m,ms=4000)=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',ms)};
const fmtT=(ms,d=1)=>{const s=ms/1000;return Math.floor(s/60)+':'+(s%60).toFixed(d).padStart(d?4:2,'0')};
const FONTS=[['Arial, Helvetica, sans-serif','Arial'],['system-ui, sans-serif','System UI'],['Georgia, serif','Georgia'],['"Times New Roman", serif','Times New Roman'],['Impact, "Arial Black", sans-serif','Impact'],['"Trebuchet MS", sans-serif','Trebuchet'],['"Courier New", monospace','Courier New']];
/* ===== project model ===== */
const mkText=()=>({id:uid(),text:'Welcome to church!',start:0,end:Math.min(10000,L()),en:true,font:FONTS[0][0],maxW:.8,size:90,weight:600,italic:false,color:'#ffffff',x:.5,y:.2,align:'center',lh:1.2,ls:0,shadow:40,outline:0,outlineColor:'#000000',panel:false,panelColor:'#000000',panelA:.5,opacity:1,anIn:'fade',anOut:'fade',ms:600});
const mkProject=()=>({v:1,name:'Untitled countdown',w:1920,h:1080,fps:30,mbps:8,dur:300000,endHold:0,fadeIn:500,fadeOut:500,pq:.5,safe:false,file:'countdown',
 timer:{font:FONTS[0][0],size:300,weight:300,italic:false,color:'#ffffff',x:.5,y:.5,align:'center',ls:0,lh:1,shadow:30,outline:0,outlineColor:'#000000',panel:false,panelColor:'#000000',panelA:.45,opacity:1,mono:true,fmt:'auto',lead:true,end:'freeze',endText:'',z:'below'},
 bg:{type:'gradient',c1:'#0a1f5c',c2:'#2f6bff',angle:20,asset:null,fit:'cover',scale:1,ox:0,oy:0,bright:100,dim:0,ovC:'#000000',ovA:0,loop:true,speed:1,after:'freeze'},
 fonts:[],texts:[]});
let P=mkProject();const A={};/* assets: id -> {el,blob,name} */
const L=()=>P.dur+P.endHold;
const S={t:0,playing:false,sel:'timer',tab:0,pps:2,boxes:[],base:0,t0:0,stopAt:0,saved:true};
const H={s:[],i:-1};
/* ===== storage ===== */
const db=new Promise((res,rej)=>{try{const r=indexedDB.open('pts-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const idb=async(m,fn)=>{const d=await db;return new Promise((res,rej)=>{const q=fn(d.transaction('k',m).objectStore('k'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const kget=k=>idb('readonly',s=>s.get(k)),kset=(k,v)=>idb('readwrite',s=>s.put(v,k));
let svT;const status=()=>$('#status').textContent=S.saved===true?'Saved locally':S.saved===null?'Autosave unavailable':'Unsaved…';
function schedSave(){S.saved=false;status();clearTimeout(svT);svT=setTimeout(async()=>{try{await kset('proj',JSON.parse(JSON.stringify(P)));S.saved=true}catch(e){S.saved=null}status()},500)}
/* ===== history ===== */
function commit(){const s=JSON.stringify(P);if(s!==H.s[H.i]){H.s=H.s.slice(0,H.i+1);H.s.push(s);H.i++;if(H.s.length>100){H.s.shift();H.i--}}}
function hist(d){const i=H.i+d;if(i<0||i>=H.s.length)return;H.i=i;P=JSON.parse(H.s[i]);reload(false)}
function changed(tl){frame();if(tl)renderTL();schedSave()}
/* ===== assets ===== */
async function mkMedia(blob,kind){const url=URL.createObjectURL(blob);
 if(kind==='image'){const i=new Image();i.src=url;await i.decode();return i}
 const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
 await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=()=>no(new Error('decode'));setTimeout(()=>no(new Error('timeout')),15000)});
 v.addEventListener('seeked',()=>{if(!S.playing)frame()});return v}
async function loadFontBlob(f,blob){const ff=new FontFace(f.family,await blob.arrayBuffer());await ff.load();document.fonts.add(ff)}
async function setBg(file){if(!file)return;const kind=file.type.startsWith('video')?'video':file.type.startsWith('image')?'image':null;
 if(!kind)return toast('Unsupported file. Choose an image (JPEG/PNG/WebP) or a video (MP4/WebM).');
 try{const e=await mkMedia(file,kind),id=uid();A[id]={el:e,blob:file,name:file.name};await kset('a:'+id,{blob:file,name:file.name});
  P.bg.asset={id,name:file.name,kind};P.bg.type=kind;if(kind==='video')e.loop=true;commit();changed();panel()}
 catch(e){toast('Could not decode "'+file.name+'". Your browser may not support this format/codec.')}}
async function addFont(file){if(!file)return;const id=uid(),f={id,name:file.name.replace(/\.[^.]+$/,''),family:'UF_'+id};
 try{await loadFontBlob(f,file);await kset('a:'+id,{blob:file,name:file.name});P.fonts.push(f);commit();changed();panel();toast('Font "'+f.name+'" added.')}catch(e){toast('Could not load that font file (.ttf .otf .woff .woff2 supported).')}}
const fontOpts=()=>[...FONTS,...P.fonts.map(f=>['"'+f.family+'", sans-serif',f.name+' (uploaded)'])];
const bgVid=()=>{const a=P.bg.asset;return a&&a.kind==='video'&&P.bg.type==='video'&&A[a.id]?A[a.id].el:null};
/* ===== rendering ===== */
const ease=x=>{x=cl(x,0,1);return x*x*(3-2*x)};
function fmtTimer(t){const T=P.timer,rem=Math.max(0,P.dur-t),s=Math.ceil(rem/1000-1e-9),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sc=s%60,p=n=>String(n).padStart(2,'0');
 const hh=T.fmt==='hhmmss'||(T.fmt==='auto'&&P.dur>=3600000);
 if(hh)return(T.lead?p(h):h)+':'+p(m)+':'+p(sc);const tm=Math.floor(s/60);return(T.lead?p(tm):tm)+':'+p(sc)}
function vidTime(t){const v=bgVid();if(!v||!v.duration)return 0;const d=v.duration,raw=t/1000*(P.bg.speed||1);return raw%d}
function drawBg(x,w,h,t){const b=P.bg;x.fillStyle=b.c1;x.fillRect(0,0,w,h);
 if(b.type==='gradient'){const a=b.angle*Math.PI/180,r=Math.hypot(w,h)/2,cx=w/2,cy=h/2,g=x.createLinearGradient(cx-Math.sin(a)*r,cy+Math.cos(a)*r,cx+Math.sin(a)*r,cy-Math.cos(a)*r);g.addColorStop(0,b.c1);g.addColorStop(1,b.c2);x.fillStyle=g;x.fillRect(0,0,w,h)}
 const m=b.asset&&A[b.asset.id]?A[b.asset.id].el:null;
 if(m&&(b.type==='image'||b.type==='video')){const iw=m.videoWidth||m.naturalWidth,ih=m.videoHeight||m.naturalHeight;let skip=false;
  
  if(!skip&&iw&&ih){const k=b.fit==='stretch'?0:b.fit==='contain'?Math.min(w/iw,h/ih):Math.max(w/iw,h/ih);let dw=(k?iw*k:w)*b.scale,dh=(k?ih*k:h)*b.scale;
   x.filter='brightness('+b.bright+'%)';try{x.drawImage(m,(w-dw)/2+b.ox*w/100,(h-dh)/2+b.oy*h/100,dw,dh)}catch(e){}x.filter='none'}}
 if(b.ovA>0){x.globalAlpha=b.ovA/100;x.fillStyle=b.ovC;x.fillRect(0,0,w,h);x.globalAlpha=1}
 if(b.dim>0){x.globalAlpha=b.dim/100;x.fillStyle='#000';x.fillRect(0,0,w,h);x.globalAlpha=1}}
function dText(c,s,o,str,al,dx,dy,sc,id,rec){const px=o.size*s*sc;if(px<1||al<=0)return;c.save();c.globalAlpha=al*o.opacity;
 c.font=(o.italic?'italic ':'')+o.weight+' '+px+'px '+o.font;if('letterSpacing'in c)c.letterSpacing=(o.ls*s*sc)+'px';c.textBaseline='middle';c.lineJoin='round';
 const lh=px*o.lh,dw=o.mono?Math.max(...'0123456789'.split('').map(d=>c.measureText(d).width)):0;
 const wOf=l=>o.mono?[...l].reduce((a,ch)=>a+(/\d/.test(ch)?dw:c.measureText(ch).width),0):c.measureText(l).width;
 const wrapP=(p,max)=>{const out=[];let cur='';for(const wd of p.split(/(?<=\s)/)){if(!cur||c.measureText((cur+wd).trimEnd()).width<=max)cur+=wd;else{out.push(cur.trimEnd());cur=wd}}out.push(cur.trimEnd());
  return out.flatMap(l=>{if(c.measureText(l).width<=max||l.length<2)return[l];const r=[];let q='';for(const ch of l){if(q&&c.measureText(q+ch).width>max){r.push(q);q=ch}else q+=ch}r.push(q);return r})};
 const ls=o.maxW?str.split('\n').flatMap(p=>wrapP(p,o.maxW*c.canvas.width)):str.split('\n');
 const W=Math.max(...ls.map(wOf)),H=lh*ls.length,cx=o.x*c.canvas.width+dx,cy=o.y*c.canvas.height+dy,BW=o.maxW?o.maxW*c.canvas.width:W,left=o.align==='left'?cx-BW/2:o.align==='right'?cx+BW/2-W:cx-W/2;
 if(o.panel){const p=px*.35;c.save();c.globalAlpha=al*o.opacity*o.panelA;c.fillStyle=o.panelColor;c.fillRect(left-p,cy-H/2-p/2,W+2*p,H+p);c.restore()}
 if(o.shadow){c.shadowColor='rgba(0,0,0,.75)';c.shadowBlur=px*o.shadow/300;c.shadowOffsetY=px*o.shadow/700}
 const ax=o.align==='left'?cx-BW/2:o.align==='right'?cx+BW/2:cx;
 ls.forEach((l,i)=>{const y=cy-H/2+lh*(i+.5);
  const put=(txt,xx,al2)=>{c.textAlign=al2;if(o.outline>0){c.strokeStyle=o.outlineColor;c.lineWidth=o.outline*s*sc*2;c.strokeText(txt,xx,y)}c.fillStyle=o.color;c.fillText(txt,xx,y)};
  if(o.mono){let w0=wOf(l),x0=o.align==='left'?ax:o.align==='right'?ax-w0:ax-w0/2;for(const ch of l){const cw=/\d/.test(ch)?dw:c.measureText(ch).width;put(ch,x0+cw/2,'center');x0+=cw}}
  else put(l,ax,o.align)});
 c.restore();if(rec){S.boxes.push({id,x:left,y:cy-H/2,w:W,h:H});if(o.maxW)S.wrapBox={id,x:cx-BW/2,y:cy-H/2,w:BW,h:H}}}
function render(c,t,rec){const w=c.canvas.width,h=c.canvas.height,s=h/1080;if(rec){S.boxes=[];S.wrapBox=null}c.save();c.clearRect(0,0,w,h);drawBg(c,w,h,t);
 const T=P.timer,tim=()=>dText(c,s,T,(t>=P.dur&&T.end==='text'&&T.endText)?T.endText:fmtTimer(t),1,0,0,1,'timer',rec);
 if(T.z==='below')tim();
 for(const tx of P.texts){if(!tx.en||t<tx.start||t>=tx.end)continue;const m=tx.ms||1,ai=tx.anIn!=='none'?ease((t-tx.start)/m):1,ao=tx.anOut!=='none'?ease((tx.end-t)/m):1;
  dText(c,s,tx,tx.text,ai*ao,0,(tx.anIn==='slide'?(1-ai)*50*s:0)-(tx.anOut==='slide'?(1-ao)*50*s:0),(tx.anIn==='zoom'?.85+.15*ai:1)*(tx.anOut==='zoom'?.85+.15*ao:1),tx.id,rec)}
 if(T.z==='above')tim();
 let f=0;if(P.fadeIn>0)f=Math.max(f,1-t/P.fadeIn);if(P.fadeOut>0)f=Math.max(f,1-(L()-t)/P.fadeOut);
 if(f>0){c.globalAlpha=Math.min(1,f);c.fillStyle='#000';c.fillRect(0,0,w,h)}c.restore()}
/* ===== preview / transport ===== */
const cv=$('#cv'),cx=cv.getContext('2d');
function sizeCanvas(){const q=P.pq;cv.width=Math.round(P.w*q/2)*2;cv.height=Math.round(P.h*q/2)*2;fit()}
function fit(){const st=$('#stage'),a=P.w/P.h,W=st.clientWidth-24,Hh=st.clientHeight-24;let w=W,h=W/a;if(h>Hh){h=Hh;w=h*a}cv.style.width=Math.max(50,w)+'px';cv.style.height=Math.max(30,h)+'px';const sf=$('#safe');sf.style.display=P.safe?'block':'none'}
function frame(){render(cx,S.t,true);const wb=S.wrapBox,wh=$('#wh');if(wb&&wb.id===S.sel){wh.style.display='block';wh.style.left=wb.x/cv.width*100+'%';wh.style.width=wb.w/cv.width*100+'%';wh.style.top=wb.y/cv.height*100+'%';wh.style.height=wb.h/cv.height*100+'%'}else wh.style.display='none';$('#ph').style.left=(S.t/1000*S.pps)+'px';$('#scrub').value=S.t/L()*1000;$('#tt').textContent=fmtT(S.t)+' / '+fmtT(L(),0);$('#bPlay').textContent=S.playing?'❚❚':'▶'}
function syncV(t,pl){const v=bgVid();if(!v||!v.duration)return;const vt=vidTime(t);v.loop=true;
 if(pl){v.playbackRate=cl(P.bg.speed||1,.25,4);if(v.paused)v.play().catch(()=>{});if(Math.abs(v.currentTime-vt)>.35)v.currentTime=vt}
 else{v.pause();if(Math.abs(v.currentTime-vt)>.02)v.currentTime=vt}}
function play(stopAt){if(S.playing)return;if(S.t>=L()-1)S.t=0;S.playing=true;S.base=performance.now();S.t0=S.t;S.stopAt=stopAt??L();loop()}
function loop(){if(!S.playing)return;S.t=Math.min(S.stopAt,S.t0+performance.now()-S.base);syncV(S.t,true);frame();if(S.t>=S.stopAt){pause();return}S.raf=requestAnimationFrame(loop)}
function pause(){S.playing=false;cancelAnimationFrame(S.raf);syncV(S.t,false);frame()}
